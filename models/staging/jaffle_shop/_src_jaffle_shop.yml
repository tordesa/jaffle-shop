version: 2

sources:
  - name: raw_data
    description: "raw data sources for jaffle_shop customers and orrders"
    database: dbt-learn-488118
    schema: jaffle_shop
    tables:
      - name: customers
      - name: orders
        config:
          freshness:
            warn_after:
              count: 6
              period: day
            error_after:
              count: 12
              period: day
          loaded_at_field: ORDER_DATE

  - name: stripe
    description: "raw data sources for stripe payments"
    database: dbt-learn-488118
    schema: stripe
    tables:
      - name: payments